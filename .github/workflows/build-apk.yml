name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare signing keystore
        run: |
          keytool -genkeypair -v -keystore android/app/release.jks -storepass 123456 -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -alias release -dname "CN=ProxyPin,O=Dev,C=CN"
          printf 'storePassword=123456\nkeyPassword=123456\nkeyAlias=release\nstoreFile=release.jks\n' > android/key.properties

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proxypin-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
